name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      # The only check that proves the tool still works once it has been through a
      # package: it packs to a local feed, installs from it and drives the real HTTP
      # endpoints. It needs no credentials.
      - name: Smoke test
        run: ./tests/smoke/run.sh
